# Вход машины. Единственный поддерживаемый способ запуска.
#
# Здесь нет ни одного продукта — только nginx с картой и certbot с сертификатом. Всё, что за
# входом, живёт своей жизнью, в своих репозиториях и со своим циклом выпуска.

name: gate

services:
  # Первичная выдача сертификата. Разовым запуском и ДО nginx: без сертификата nginx не
  # поднимется вовсе, а уже поднятый занял бы порт, который нужен проверке владения.
  #
  # network_mode: host — проверка приходит на 80 порт САМОЙ машины, и другого способа занять
  # его на минуту у контейнера нет. К этому моменту nginx ещё не стартовал, так что порт свободен.
  #
  # Повторный запуск безвреден: при живом сертификате certbot ничего не делает и выходит успехом.
  # Поэтому шаг стоит в обычном подъёме, а не в отдельной инструкции, которую забудут выполнить.
  issue:
    image: certbot/certbot:latest
    network_mode: host
    environment:
      GATE_HOST: ${GATE_HOST:?нужно имя машины, смотри .env.example}
      ACME_EMAIL: ${ACME_EMAIL:?нужна почта для сертификата, смотри .env.example}
    volumes:
      - certs:/etc/letsencrypt
    # Точка входа образа — сам certbot, а нам нужна проверка перед ним.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Сертификат уже лежит — выдавать нечего, продлением занимается сосед по этому compose.
        #
        # Проверка стоит ДО certbot, и это не оптимизация. Выпуск НОВОГО сертификата на голый
        # АДРЕС (в отличие от домена) certbot здесь отказывается делать — при том что ПРОДЛЕНИЕ
        # уже существующего проходит, и это проверено вхолостую. Без этой ветки подъём падал бы
        # на машине, где сертификат давно лежит рядом, причём не единожды, а при каждом
        # перезапуске.
        #
        # Следствие, которое надо знать заранее: потеряв том с сертификатом на машине без домена,
        # выпустить новый отсюда не выйдет — это делается снаружи, тем же certbot на самой
        # машине. С доменом такой оговорки нет.
        if [ -s "/etc/letsencrypt/live/$$GATE_HOST/fullchain.pem" ]; then
          echo "сертификат на месте, выдача не нужна"
          exit 0
        fi

        exec certbot certonly --standalone --non-interactive --agree-tos           --email "$$ACME_EMAIL" --key-type ecdsa --keep-until-expiring           --preferred-profile shortlived -d "$$GATE_HOST"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      issue:
        # Не «контейнер запущен», а «выдача закончилась успехом»: иначе nginx стартует раньше
        # сертификата и падает на его отсутствии.
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATE_HOST: ${GATE_HOST}
      # Подстановка ТОЛЬКО в свои переменные. Без этого фильтра образ подставил бы и `$host`
      # с `$remote_addr` — то есть съел бы половину конфигурации nginx.
      NGINX_ENVSUBST_FILTER: "^GATE_"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/no-default.conf:/etc/nginx/conf.d/default.conf:ro
      # Каталог, который entrypoint образа выполняет перед запуском nginx. Разбор — в самом файле.
      - ./nginx/reload.sh:/docker-entrypoint.d/99-reload.sh:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
    networks:
      - neurobox
    # Команда НЕ переопределяется намеренно: entrypoint образа подставляет переменные в шаблоны
    # только если команда начинается с `nginx`. Подмени её — и конфигурация досталась бы nginx с
    # неподставленным именем машины, то есть с несуществующим путём к сертификату. Перечитывание
    # по кругу живёт отдельным файлом в /docker-entrypoint.d.

  # Продление. Через файл на диске, который отдаёт живой nginx, а НЕ занимая порт: старый способ
  # ронял вход на время продления, то есть раз в несколько дней сайт на минуту исчезал.
  renew:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/acme
    # Точка входа образа — сам certbot, поэтому под цикл её приходится сменить: иначе команда
    # ниже досталась бы ему как аргументы и он бы на них споткнулся.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/acme --quiet
          sleep 12h & wait $!
        done

volumes:
  certs:
  acme:

# Сети соседей. ВНЕШНИЕ: их заводит сосед, а вход только подключается — иначе вход владел бы
# чужой сетью и уносил её с собой, уходя.
#
# Цена названа прямо: без этих сетей вход не поднимется. Карта, ведущая в место, которого нет,
# — это не работающий вход с одним потерянным соседом, это неправда в конфигурации.
networks:
  neurobox:
    external: true
    name: neurobox_default

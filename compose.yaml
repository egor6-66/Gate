# Вход машины. Единственный поддерживаемый способ запуска.
#
# Здесь нет ни одного продукта — только nginx с картой и клиент, который добывает сертификат.
# Всё, что за входом, живёт своей жизнью, в своих репозиториях и со своим циклом выпуска.

name: gate

services:
  # Первичная выдача. Разовым шагом и ДО nginx: без сертификата nginx не поднимется вовсе, а уже
  # поднятый занял бы порт, который нужен проверке владения.
  #
  # network_mode: host — проверка приходит на 80 порт САМОЙ машины, и другого способа занять его
  # на минуту у контейнера нет. К этому моменту nginx ещё не стартовал, порт свободен.
  issue:
    image: goacme/lego:latest
    network_mode: host
    environment:
      GATE_HOST: ${GATE_HOST:?нужно имя машины, смотри .env.example}
      ACME_EMAIL: ${ACME_EMAIL:?нужна почта для сертификата, смотри .env.example}
    volumes:
      - certs:/certs
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Сертификат уже лежит — выдавать нечего. Продлевать его будет сосед по этому compose,
        # и делать это через файл у живого nginx, не отнимая порт.
        #
        # Ветка нужна ещё и потому, что шаг стоит в КАЖДОМ подъёме: занимать порт при живом
        # nginx он не должен, а обойти это можно только не дойдя до попытки.
        if [ -s "/certs/certificates/$$GATE_HOST.crt" ]; then
          echo "сертификат на месте, выдача не нужна"
          exit 0
        fi

        # Бинарь зовётся по полному пути: в образе он лежит в корне, а не в путях поиска, и при
        # смене точки входа перестаёт находиться по имени.
        exec /lego run --accept-tos --email "$$ACME_EMAIL" --path /certs \
          --key-type ec256 --profile shortlived --domains "$$GATE_HOST" \
          --http --http.address :80

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      issue:
        # Не «контейнер запущен», а «выдача закончилась успехом»: иначе nginx стартует раньше
        # сертификата и падает на его отсутствии.
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Порты соседей, кроме главного: каждый — одна строка здесь и один файл в templates.
      - "8443:8443"
    environment:
      GATE_HOST: ${GATE_HOST}
      # Подстановка ТОЛЬКО в свои переменные. Без этого фильтра образ подставил бы и `$host`
      # с `$remote_addr` — то есть съел бы половину конфигурации nginx.
      NGINX_ENVSUBST_FILTER: "^GATE_"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/no-default.conf:/etc/nginx/conf.d/default.conf:ro
      # Каталог, который entrypoint образа выполняет перед запуском nginx. Разбор — в самом файле.
      - ./nginx/reload.sh:/docker-entrypoint.d/99-reload.sh:ro
      - certs:/certs:ro
      - acme:/var/www/acme:ro
    networks:
      - neurobox

  # Продление. Через файл на диске, который отдаёт живой nginx, а НЕ занимая порт: иначе вход
  # приходилось бы ронять на время продления, а сертификат здесь живёт неделю — сайт исчезал бы
  # на минуту раз в несколько дней.
  #
  # Когда продлевать, решает не наш таймер, а сам удостоверяющий центр: клиент спрашивает его об
  # этом и следует ответу. Своя формула на коротком сертификате промахивается легко, а промах
  # виден только просроченным замком у посетителя.
  renew:
    image: goacme/lego:latest
    depends_on:
      - nginx
    restart: unless-stopped
    environment:
      GATE_HOST: ${GATE_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - certs:/certs
      - acme:/var/www/acme
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          # Полный путь: в образе бинарь лежит в корне, а не в путях поиска.
          /lego run --accept-tos --email "$$ACME_EMAIL" --path /certs \
            --key-type ec256 --profile shortlived --domains "$$GATE_HOST" \
            --http --http.webroot /var/www/acme || true
          sleep 12h & wait $$!
        done

volumes:
  certs:
  acme:

# Сети соседей. ВНЕШНИЕ: их заводит сосед, а вход только подключается — иначе вход владел бы
# чужой сетью и уносил её с собой, уходя.
#
# Цена названа прямо: без этих сетей вход не поднимется. Карта, ведущая в место, которого нет,
# — это не работающий вход с одним потерянным соседом, это неправда в конфигурации.
networks:
  neurobox:
    external: true
    name: neurobox_default

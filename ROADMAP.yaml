# Дорожная карта входа — источник правды по фактически сделанной работе. Статус проставляется
# рядом с работой, в момент когда она сделана — не задним числом. Формат тот же, что у остальных
# роадмапов (categories → items, log → журнал решений).

categories:
  - category: Основание
    items:
      - id: repo-and-scope
        type: plan
        status: Done
        priority: High
        milestone: null
        name: Отдельный репозиторий и границы входа
        description: |
          Означает: вход выделен из продуктов и не принадлежит ни одному соседу. Решение принято
          человеком до первого кода. Причина: за входом больше одного продукта, и владей им любой
          из них — остальные стали бы его гостями, а их доступность зависела бы от чужого цикла
          выпуска.

      - id: map-one-file-per-neighbour
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Карта — по файлу на соседа
        description: |
          Означает: всё, что вход знает о соседе, помещается в три строки одного файла — порт,
          сеть, имя контейнера. Добавить соседа значит положить файл рядом. Файлы соседей друг
          друга не читают, поэтому новосёл не может сломать существующих.

      - id: ports-not-paths
        type: plan
        status: Done
        priority: High
        milestone: null
        name: Соседи разведены портами
        description: |
          Означает: браузер держит соседей врозь сам, без доверия между продуктами. Пути этого не
          дают — браузер их не различает, и общий порт означал бы общее хранилище и общие права.
          Цена названа прямо: куки портами не разделяются, изоляция кук — забота соседа.

      - id: cert-owned-by-gate
        type: feature
        status: Done
        priority: High
        milestone: null
        name: Сертификат принадлежит входу
        description: |
          Означает: выдача стоит в обычном подъёме и повторный запуск безвреден, а продление идёт
          через файл у живого nginx. Прежний способ на этой машине останавливал вход на время
          продления — сайт исчезал на минуту раз в несколько дней.

  - category: Дальше
    items:
      - id: domain-and-subdomains
        type: plan
        status: Backlog
        priority: Medium
        milestone: null
        name: Домен и поддомены вместо портов
        description: |
          Означает: соседи разъезжаются по именам и живут все на 443, порты из карты уходят.
          Настоящая изоляция вместо портовой, и куки перестают течь между соседями. Ждёт домена —
          на адрес поддомен не выпишешь.

      - id: neighbour-health
        type: plan
        status: Backlog
        priority: Low
        milestone: null
        name: Видимость состояния соседей
        description: |
          Означает: по одному адресу видно, кто из соседей отвечает, а кто нет. Сейчас это
          выясняется запросом к каждому. Заводить раньше, чем соседей станет больше трёх, незачем
          — страница состояния для двоих врёт про сложность, которой нет.

log:
  - id: gate-is-nobodys
    type: plan
    date: 2026-09-07
    summary: >
      Вход решено вынести отдельно от обоих продуктов. Обсуждались два варианта: вход внутри
      NeuroBox (тогда NeuroBox отвечает за доступность windshift) и вход внутри windshift
      (симметрично наоборот). Оба отвергнуты человеком: вход — свойство машины, а не товара.
      Следствие, названное сразу: продукты за входом не приобретают друг от друга ни одной
      зависимости, кроме общей точки отказа, которой вход и является.

  - id: ports-over-paths
    type: plan
    date: 2026-09-07
    summary: >
      Соседей развели по портам, а не по путям общего порта. Причина не в удобстве: браузер
      различает места по схеме, имени и порту, но не по пути, поэтому общий порт означал бы для
      него ОДНО место — общее хранилище, общие права, доступ к чужому API от имени вошедшего, и
      дыра в одном продукте становилась бы дырой в другом при полном отсутствии общего кода.
      Цена принята сознательно: адрес пульта содержит порт, а куки портами не разделяются.
      Правильный конец — домен и поддомены; тогда порты из карты уходят.

  - id: renewal-without-downtime
    type: feature
    date: 2026-09-07
    summary: >
      Продление сертификата переведено с занятия порта на файл у живого nginx. На машине стоял
      certbot, который останавливал контейнер nginx перед продлением и запускал после — то есть
      раз в несколько дней вход исчезал на минуту, и по логам это выглядело как случайный сбой.
      Сертификат здесь короткоживущий (неделя), поэтому продление частое, и цена простоя росла бы.
      Заодно nginx учится перечитывать себя сам: файлы он читает один раз при старте.
